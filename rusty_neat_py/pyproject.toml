[project]
name = "rusty-neat-py"
version = "0.1.0"
description = "Python binding to Rusty-NEAT"
authors = [{ name = "Konstantin Klepikov", email = "oformleno@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = ["numpy (>=2.4.1,<3.0.0)"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.group.dev.dependencies]
maturin = "^1.11.5"
pytest = "^9.0.2"
pytest-cov = "^4.1.0"
flake8 = "^6.1.0"
flake8-broken-line = "^1.0.0"
flake8-return = "^1.2.0"
flake8-isort = "^6.1.1"
flake8-quotes = "^3.3.2"
flake8-bugbear = "^23.9.16"
flake8-pyproject = "^1.2.3"
pep8-naming = "^0.13.3"
mypy = "^1.13.0"
ruff = "^0.7.2"


[tool.blue]
line-length = 88
preview = true


[tool.isort]
profile = "black"


[tool.flake8]
max-line-length = 88
max-complexity = 10
extend-immutable-calls = ["Depends"]


[tool.ruff]
line-length = 88


[tool.ruff.format]
quote-style = "single"


[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = ["src", "app", "tests"]


[tool.pytest.ini_options]
pythonpath = ["app", "src"]
python_files = "test_*.py"
testpaths = "tests"
norecursedirs = ["venv*", ".venv"]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
addopts = "-v -x -s -p no:warnings"
