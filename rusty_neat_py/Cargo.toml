[package]
name = "rusty_neat_py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for rusty-neat (PyO3/maturin)"
license = "MIT"

[lib]
name = "rusty_neat_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.18", features = ["extension-module"] }
rusty_neat = { path = "../", package = "rusty-neat" }
numpy = "0.18"
ndarray = "0.15"
serde_json = "1.0"
rand = "0.9"

[package.metadata.maturin]
sdist = true
