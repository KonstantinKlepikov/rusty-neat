name: CI - Python bindings

on:
  pull_request:
    paths:
      - 'rusty_neat_py/**'
      - '.github/workflows/**'

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('rusty_neat_py/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install Python deps with Poetry (no-root)
        working-directory: rusty_neat_py
        run: |
          poetry config virtualenvs.create true
          # install only dependencies, do not attempt to install the local package
          poetry install --no-interaction --no-ansi --no-root

      - name: Build wheel with maturin
        working-directory: rusty_neat_py
        run: |
          poetry run maturin build --release

      - name: Install wheel
        working-directory: rusty_neat_py
        run: |
          pip install target/wheels/*.whl

      - name: Run pytest
        working-directory: rusty_neat_py
        run: |
          poetry run pytest -q
